[package]
name = "pane-script"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Run a folder of Luau UI with upstream rune-luau, hot reloading on save."

[dependencies]
pane-ui.workspace = true
rune = { workspace = true, default-features = true, features = ["terminal"] }
rune-luau = { workspace = true, features = ["watch"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "fs", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
base64 = "0.22"
png = "0.18"
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
