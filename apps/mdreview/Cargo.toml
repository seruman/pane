[package]
name = "mdreview"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Review a Markdown document in a terminal pane: comment on what you select with Vim's keys, and send the review as Markdown feedback."

[dependencies]
rune = { workspace = true, default-features = true, features = ["terminal"] }
rune-kit = { workspace = true, features = ["markdown"] }
pane-ui.workspace = true
vimkeys.workspace = true
pulldown-cmark.workspace = true

[lints]
workspace = true
