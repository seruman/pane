[workspace]
resolver = "3"
members = ["crates/pane-ui", "crates/vimkeys", "apps/mdview", "apps/gallery", "apps/mdreview"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
rune = { path = "../../../../tmp/worktrees/github.com/seruman/rune/terminal-shell/crates/rune", default-features = false }
rune-kit = { path = "../../../../tmp/worktrees/github.com/seruman/rune/terminal-shell/crates/rune-kit" }
pane-ui = { path = "crates/pane-ui" }
vimkeys = { path = "crates/vimkeys" }
pulldown-cmark = { version = "0.13", default-features = false }

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
let_underscore_must_use = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
doc_markdown = "warn"
return_self_not_must_use = "warn"
too_many_lines = "warn"
# Require consuming builder results, not an annotation on every pure query.
must_use_candidate = "allow"
