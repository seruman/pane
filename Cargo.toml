[workspace]
resolver = "3"
members = ["crates/pane-ui", "crates/vimkeys", "apps/mdview", "apps/gallery", "apps/mdreview"]

[workspace.package]
edition = "2024"
license = "MIT"

# The Rune fork with the terminal shell. A local checkout while we iterate; switch to
# `git = "...", rev = "..."` once it lives somewhere.
[workspace.dependencies]
rune = { path = "../../../../tmp/worktrees/github.com/seruman/rune/terminal-shell/crates/rune" }
rune-kit = { path = "../../../../tmp/worktrees/github.com/seruman/rune/terminal-shell/crates/rune-kit" }
pane-ui = { path = "crates/pane-ui" }
vimkeys = { path = "crates/vimkeys" }

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true

# The same strictness as Rune's own crates.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
expect_used = "warn"
todo = "warn"
unwrap_used = "warn"
let_underscore_must_use = "warn"
